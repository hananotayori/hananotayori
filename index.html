.title{

.start-wrap{

.start{
  font-size:88px;
  line-height:1;
  cursor:pointer;
  user-select:none;
  animation:float 2.6s ease-in-out infinite;
  transition:transform 1.2s ease, opacity 1.2s ease;
  position:relative;
  z-index:2;
}

.start.hide{
  animation:none;
  transform:scale(0.2);
  opacity:0;
}

.sparkle{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(0.2);
  opacity:0;
  font-size:34px;
  transition:all 1s ease;
  pointer-events:none;
}

.sparkle.show{
  opacity:1;

}

.text{

  font-size:16px;
  color:#7a8f7e;
}

  margin:30px auto 0;
  position:relative;
  height:190px;
}

.envelope{

  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:180px;
  height:120px;
  background:#fffdf8;
  border:3px solid #8a8a8a;
  box-sizing:border-box;
  z-index:2;
}

.envelope::before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  margin:auto;
  width:0;
  height:0;
  border-left:90px solid transparent;
  border-right:90px solid transparent;
  border-bottom:50px solid #f2ede4;
}

.flap{

  top:70px;

  width:0;
  height:0;
  border-left:90px solid transparent;
  border-right:90px solid transparent;
  border-top:60px solid #efe8dc;
  transition:transform 0.9s ease;
  z-index:4;
}

.flap.open{
  transform:translateX(-50%) rotateX(180deg);
}

position:absolute;
left:50%;
bottom:20px;
transform:translateX(-50%);

z-index:1;

  border:2px solid #d8d0c3;

let current = 0;
let score = 0;

function startTest(){
  current = 0;
  score = 0;
  document.getElementById("startArea").style.display = "none";
  document.getElementById("questionArea").style.display = "block";
  showQuestion();
}

function showQuestion(){
  document.getElementById("questionText").innerText = questions[current];
}

function answer(point){
  score += point;
  current++;
  if(current < questions.length){
    showQuestion();
  }else{
    showResult();
  }
}

function showResult(){
  document.getElementById("questionArea").style.display = "none";
  document.getElementById("envelopeArea").style.display = "block";
  openLetter();
}

function showEnvelope(){
  const btn = document.getElementById("startBtn");
  const sparkle = document.getElementById("sparkle");

  btn.classList.add("hide");
  sparkle.classList.add("show");

  setTimeout(function(){
    document.getElementById("startArea").style.display = "none";
    document.getElementById("envelopeArea").style.display = "block";
    openLetter();
  }, 1400);
}
function openLetter(){
  const flap = document.getElementById("flap");
  const letter = document.getElementById("letter");
  const result = document.getElementById("result");
  const message = document.getElementById("message");
  const share = document.getElementById("share");
  const shareBtn = document.getElementById("shareBtn");
  const n = score % flowers.length;

  setTimeout(function(){
    flap.classList.add("open");
  }, 250);

  setTimeout(function(){
    letter.classList.add("show");
  }, 550);

  setTimeout(function(){
    result.innerHTML =
      "今日あなたに届いた花は<strong>" + flowers[n].name + "</strong>";
    message.innerHTML = flowers[n].message;

    result.classList.add("show");
    message.classList.add("show");
    share.classList.add("show");

    shareBtn.onclick = function(e){
      e.preventDefault();

      const shareText = "今日の花のたよりを受け取りました🌸 " + flowers[n].name;
      const shareUrl = location.href;

      if (navigator.share) {
        navigator.share({
          title: "花のたより",
          text: shareText,
          url: shareUrl
        });
      } else {
        window.open(
          "https://twitter.com/intent/tweet?text=" +
          encodeURIComponent(shareText) +
          "&url=" +
          encodeURIComponent(shareUrl),
          "_blank"
        );
      }
    };
  }, 1200);
}
