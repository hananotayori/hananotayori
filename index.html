<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花のたより</title>

<style>
body{
  margin:0;
  font-family:"Yu Gothic","Hiragino Sans",sans-serif;
  background:#f3f7f1;
  text-align:center;
  color:#48634d;
}

.wrap{
  width:100%;
  max-width:430px;
  margin:0 auto;
  padding:40px 20px 80px;
  box-sizing:border-box;
  position:relative;
}

.title{
  font-size:38px;
  color:#5fae66;
  margin:150px 0 20px;
  line-height:1.2;
  font-weight:500;
}

.sub{
  font-size:18px;
  line-height:1.9;
  margin-bottom:40px;
  color:#48634d;
}

.start-wrap{
  position:relative;
  width:120px;
  height:120px;
  margin:0 auto;
}

.start{
  font-size:88px;
  line-height:1;
  cursor:pointer;
  user-select:none;
  animation:float 2.6s ease-in-out infinite;
  transition:transform 1.2s ease, opacity 1.2s ease;
  position:relative;
  z-index:2;
}

.start.hide{
  animation:none;
  transform:scale(0.2);
  opacity:0;
}

.sparkle{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(0.2);
  opacity:0;
  font-size:34px;
  transition:all 1s ease;
  pointer-events:none;
}

.sparkle.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1.15);
}

.text{
  margin-top:12px;
  font-size:16px;
  color:#7a8f7e;
}

.envelope-scene{
  width:220px;
  margin:30px auto 0;
  position:relative;
  height:190px;
}

.envelope{
  position:absolute;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:180px;
  height:120px;
  background:#fffdf8;
  border:3px solid #8a8a8a;
  box-sizing:border-box;
  z-index:2;
}

.envelope::before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  margin:auto;
  width:0;
  height:0;
  border-left:90px solid transparent;
  border-right:90px solid transparent;
  border-bottom:60px solid #f2ede4;
}

.flap{
  position:absolute;
  left:50%;
  top:8px;
  transform:translateX(-50%) rotateX(0deg);
  transform-origin:top center;
  width:0;
  height:0;
  border-left:90px solid transparent;
  border-right:90px solid transparent;
  border-top:70px solid #efe8dc;
  transition:transform 0.9s ease;
  z-index:4;
}

.flap.open{
  transform:translateX(-50%) rotateX(180deg);
}

.letter{
  position:absolute;
  left:50%;
  bottom:20px;
  transform:translateX(-50%) translateY(30px);
  width:140px;
  background:#fffefb;
  border:2px solid #d8d0c3;
  border-radius:8px;
  padding:14px 10px;
  box-sizing:border-box;
  font-size:16px;
  color:#5a6f5f;
  opacity:0;
  transition:all 0.8s ease;
  z-index:1;
}

.letter.show{
  opacity:1;
  transform:translateX(-50%) translateY(-45px);
}

.result{
  margin-top:38px;
  font-size:24px;
  line-height:1.8;
  color:#48634d;
  opacity:0;
  transition:opacity 0.8s ease;
}

.result.show{
  opacity:1;
}

.result strong{
  display:block;
  margin-top:10px;
  font-size:30px;
  color:#4f7f58;
}

.message{
  margin-top:18px;
  font-size:17px;
  line-height:1.9;
  color:#5f7564;
  opacity:0;
  transition:opacity 0.8s ease;
  white-space:pre-line;
}

.message.show{
  opacity:1;
}

.side{
  position:absolute;
  top:60px;
  font-size:22px;
  line-height:1.4;
  color:#9bb79f;
}

.left{
  left:10px;
  text-align:left;
}

.right{
  right:10px;
  text-align:right;
}

@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
  100%{transform:translateY(0)}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="side left">
    🌿🤍<br>
    🌿🤍<br>
    🌿🤍
  </div>

  <div class="side right">
    🤍🌿<br>
    🤍🌿<br>
    🤍🌿
  </div>

  <div class="title">花のたより</div>

  <div class="sub">
    そっと心にふれる<br>
    あなたの花を見つけます
  </div>

  <div id="startArea">
    <div class="start-wrap">
      <div id="startBtn" class="start" onclick="showEnvelope()">🍀</div>
      <div id="sparkle" class="sparkle">✨</div>
    </div>
    <div class="text">クローバーをそっと押してください</div>
  </div>

  <div id="envelopeArea" style="display:none;">
    <div class="envelope-scene">
      <div id="letter" class="letter">花のたより</div>
      <div class="envelope"></div>
      <div id="flap" class="flap"></div>
    </div>
  </div>

  <div id="result" class="result"></div>
  <div id="message" class="message"></div>

</div>

<script>
const flowers = [
  { name:"🤍 すずらん", message:"やさしい花のたよりが届きました。" },
  { name:"🌷 チューリップ", message:"やさしい花のたよりが届きました。" },
  { name:"🌸 ラナンキュラス", message:"やさしい花のたよりが届きました。" },
  { name:"💛 フリージア", message:"やさしい花のたよりが届きました。" },
  { name:"🩷 スイートピー", message:"やさしい花のたよりが届きました。" },
  { name:"💛 菜の花", message:"やさしい花のたよりが届きました。" },
  { name:"❤️ アネモネ", message:"やさしい花のたよりが届きました。" },
  { name:"💙 デルフィニウム", message:"やさしい花のたよりが届きました。" },
  { name:"🩷 アルストロメリア", message:"やさしい花のたよりが届きました。" },
  { name:"💙 ブルースター", message:"やさしい花のたよりが届きました。" },
  { name:"🌹 バラ", message:"やさしい花のたよりが届きました。" },
  { name:"🧡 ガーベラ", message:"やさしい花のたよりが届きました。" },
  { name:"🩷 トルコキキョウ", message:"やさしい花のたよりが届きました。" },
  { name:"🤍 カラー", message:"やさしい花のたよりが届きました。" },
  { name:"🩷 スプレーカーネーション", message:"やさしい花のたよりが届きました。" },
  { name:"🤍 百合", message:"やさしい花のたよりが届きました。" },
  { name:"🤍 ブバリア", message:"やさしい花のたよりが届きました。" },
  { name:"💜 スターチス", message:"やさしい花のたよりが届きました。" },
  { name:"🩷 ストック", message:"やさしい花のたよりが届きました。" },
  { name:"🤍 かすみ草", message:"やさしい花のたよりが届きました。" },
  { name:"🤍 レースフラワー", message:"やさしい花のたよりが届きました。" },
  { name:"💜 アイリス", message:"やさしい花のたよりが届きました。" },
  { name:"💛 オンシジューム", message:"やさしい花のたよりが届きました。" },
  { name:"🩷 デンファレ", message:"やさしい花のたよりが届きました。" }
];

function showEnvelope(){
  const btn = document.getElementById("startBtn");
  const sparkle = document.getElementById("sparkle");

  btn.classList.add("hide");
  sparkle.classList.add("show");

  setTimeout(function(){
    document.getElementById("startArea").style.display = "none";
    document.getElementById("envelopeArea").style.display = "block";
    openLetter();
  }, 1400);
}

function openLetter(){
  const flap = document.getElementById("flap");
  const letter = document.getElementById("letter");
  const n = Math.floor(Math.random() * flowers.length);

  setTimeout(function(){
    flap.classList.add("open");
  }, 250);

  setTimeout(function(){
    letter.classList.add("show");
  }, 550);

  setTimeout(function(){
    const result = document.getElementById("result");
    const message = document.getElementById("message");

    result.innerHTML =
      "今日あなたに届いた花は<strong>" + flowers[n].name + "</strong>";
    message.innerHTML = flowers[n].message;

    result.classList.add("show");
    message.classList.add("show");
  }, 1200);
}
</script>

</body>
</html>
