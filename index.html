<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花のたより</title>

<style>
body{
  margin:0;
  font-family:"Yu Gothic","Hiragino Sans",sans-serif;
  background:#f6fbf6;
  color:#35523a;
  text-align:center;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.wrap{
  max-width:420px;
  padding:40px 20px;
}

.title{
  font-size:40px;
  color:#5fae66;
  margin-bottom:20px;
}

.sub{
  font-size:18px;
  line-height:1.8;
  margin-bottom:40px;
}

.start{
  font-size:70px;
  cursor:pointer;
}

.text{
  margin-top:10px;
  font-size:16px;
  color:#6c8b72;
}

.envelope{
  font-size:80px;
  margin-top:20px;
}

.seal{
  font-size:40px;
  cursor:pointer;
}

.result{
  margin-top:30px;
  font-size:26px;
  line-height:1.8;
}

.lily{
  position:absolute;
  font-size:30px;
  opacity:0.5;
}

.left{
  left:10px;
  top:80px;
}

.right{
  right:10px;
  top:80px;
}
</style>
</head>

<body>

<div class="lily left">🤍🌿🤍</div>
<div class="lily right">🤍🌿🤍</div>

<div class="wrap">

<div class="title">花のたより</div>

<div class="sub">
そっと心にふれる<br>
あなたの花を見つけます
</div>

<div id="startArea">

<div class="start" onclick="showEnvelope()">🍀</div>
<div class="text">クローバーを押してください</div>

</div>

<div id="envelopeArea" style="display:none">

<div class="envelope">✉️</div>
<div class="seal" onclick="openLetter()">🍀</div>
<div class="text">シールをめくってください</div>

</div>

<div id="result" class="result"></div>

</div>

<script>

const flowers = [
"🌸 さくら",
"🌷 チューリップ",
"🌻 ひまわり",
"🤍 すずらん",
"🌼 たんぽぽ"
];

function showEnvelope(){
  document.getElementById("startArea").style.display="none";
  document.getElementById("envelopeArea").style.display="block";
}

function openLetter(){
  const n = Math.floor(Math.random()*flowers.length);
  document.getElementById("envelopeArea").style.display="none";
  document.getElementById("result").innerHTML=
  "あなたの花は<br><b>"+flowers[n]+"</b>";
}

</script>

</body>
</html>
