<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>花のたより</title>

<style>

body{
margin:0;
font-family:"Yu Gothic","Hiragino Sans",sans-serif;
background:#f3f7f1;
text-align:center;
color:#48634d;
}

.wrap{
max-width:420px;
margin:auto;
padding:40px 20px 80px;
position:relative;
}

.title{
font-size:40px;
color:#5fae66;
margin-top:120px;
}

.sub{
font-size:18px;
line-height:1.8;
margin-top:20px;
margin-bottom:40px;
}

.start{
font-size:90px;
cursor:pointer;
animation:float 2.6s ease-in-out infinite;
transition:transform 1.8s ease, opacity 1.8s ease;
}

.start.hide{
transform:rotate(360deg) scale(0.2);
opacity:0;
}

.sparkle{
font-size:34px;
opacity:0;
transition:opacity 1s;
}

.sparkle.show{
opacity:1;
}

.text{
margin-top:10px;
color:#7a8f7e;
}

.envelopeArea{
margin-top:40px;
}

.envelope{
width:180px;
height:120px;
border:3px solid #888;
margin:auto;
position:relative;
background:white;
}

.flap{
width:0;
height:0;
border-left:90px solid transparent;
border-right:90px solid transparent;
border-top:70px solid #eae3d7;
position:absolute;
top:-1px;
left:-3px;
transform-origin:top;
transition:transform 1s;
}

.flap.open{
transform:rotateX(180deg);
}

.letter{
width:140px;
background:#fffefb;
border:2px solid #d8d0c3;
border-radius:8px;
margin:auto;
margin-top:-80px;
padding:10px;
opacity:0;
transform:translateY(30px);
transition:all 1s;
}

.letter.show{
opacity:1;
transform:translateY(-30px);
}

.result{
margin-top:40px;
font-size:24px;
opacity:0;
transition:opacity 1s;
}

.result.show{
opacity:1;
}

.message{
margin-top:16px;
font-size:17px;
opacity:0;
transition:opacity 1s;
}

.message.show{
opacity:1;
}

.side{
position:absolute;
top:60px;
font-size:22px;
line-height:1.4;
color:#9bb79f;
}

.left{
left:10px;
text-align:left;
}

.right{
right:10px;
text-align:right;
}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(-12px)}
100%{transform:translateY(0)}
}

</style>
</head>


<body>

<div class="wrap">

<div class="side left">
🌿🤍<br>
🌿🤍<br>
🌿🤍
</div>

<div class="side right">
🤍🌿<br>
🤍🌿<br>
🤍🌿
</div>

<div class="title">花のたより</div>

<div class="sub">
そっと心にふれる<br>
あなたの花を見つけます
</div>


<div id="startArea">

<div id="startBtn" class="start" onclick="showEnvelope()">🍀</div>

<div id="sparkle" class="sparkle">✨</div>

<div class="text">
クローバーをそっと押してください
</div>

</div>


<div id="envelopeArea" style="display:none" class="envelopeArea">

<div class="envelope">

<div id="flap" class="flap"></div>

</div>

<div id="letter" class="letter">
花のたより
</div>

</div>


<div id="result" class="result"></div>

<div id="message" class="message"></div>

</div>


<script>

const flowers=[

{
name:"🤍 すずらん",
message:"やさしく静かな心を持つあなた。そっと寄り添う力があります。"
},

{
name:"🌸 さくら",
message:"新しい流れを呼び込む人。あなたは始まりを運びます。"
},

{
name:"🌷 チューリップ",
message:"素直なあたたかさを持つ人。まっすぐな心が魅力です。"
},

{
name:"🌻 ひまわり",
message:"周りを明るく照らす人。あなたの笑顔は太陽のようです。"
},

{
name:"🌼 たんぽぽ",
message:"自然体の強さを持つ人。しなやかに咲く力があります。"
}

];


function showEnvelope(){

const btn=document.getElementById("startBtn")
const sparkle=document.getElementById("sparkle")

btn.classList.add("hide")

sparkle.classList.add("show")

setTimeout(function(){

document.getElementById("startArea").style.display="none"

document.getElementById("envelopeArea").style.display="block"

openLetter()

},1800)

}



function openLetter(){

const flap=document.getElementById("flap")

const letter=document.getElementById("letter")

const n=Math.floor(Math.random()*flowers.length)

setTimeout(function(){

flap.classList.add("open")

},300)


setTimeout(function(){

letter.classList.add("show")

},700)


setTimeout(function(){

const result=document.getElementById("result")

const message=document.getElementById("message")

result.innerHTML="今日あなたに届いた花は<strong>"+flowers[n].name+"</strong>"

message.innerHTML=flowers[n].message

result.classList.add("show")

message.classList.add("show")

},1400)

}

</script>


</body>
</html>
