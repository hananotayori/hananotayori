<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花のたより</title>

<style>
body{
  margin:0;
  font-family:"Yu Gothic","Hiragino Sans",sans-serif;
  background:#f3f7f1;
  color:#35523a;
  text-align:center;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.wrap{
  width:100%;
  max-width:430px;
  padding:40px 20px 70px;
  box-sizing:border-box;
  position:relative;
}

.title{
  font-size:40px;
  color:#5fae66;
  margin:180px 0 20px;
  line-height:1.2;
}

.sub{
  font-size:18px;
  line-height:1.8;
  margin-bottom:40px;
  color:#48634d;
}

.start{
  font-size:92px;
  cursor:pointer;
  animation:float 2.5s ease-in-out infinite;
  line-height:1;
}

.text{
  margin-top:14px;
  font-size:16px;
  color:#7a8f7e;
}

.envelope-wrap{
  position:relative;
  width:170px;
  margin:20px auto 0;
  height:170px;
}

.envelope{
  font-size:120px;
  line-height:1;
  position:absolute;
  left:50%;
  top:18px;
  transform:translateX(-50%);
}

.seal{
  font-size:46px;
  cursor:pointer;
  position:absolute;
  left:50%;
  top:88px;
  transform:translateX(-50%);
  line-height:1;
}

.result{
  margin-top:34px;
  font-size:24px;
  line-height:1.8;
  color:#48634d;
}

.result strong{
  display:block;
  margin-top:10px;
  font-size:30px;
  color:#4f7f58;
}

.message{
  margin-top:18px;
  font-size:17px;
  line-height:1.9;
  color:#5f7564;
}

.lily{
  position:absolute;
  top:55px;
  font-size:20px;
  line-height:1.3;
  color:#9bb79f;
  opacity:0.95;
}

.left{
  left:8px;
  text-align:left;
}

.right{
  right:8px;
  text-align:right;
}

@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
  100%{transform:translateY(0);}
}
</style>
</head>
<body>

<div class="wrap">

  <div class="lily left">
    🌿🤍<br>
    🌿🤍<br>
    🌿🤍
  </div>

  <div class="lily right">
    🤍🌿<br>
    🤍🌿<br>
    🤍🌿
  </div>

  <div class="title">花のたより</div>

  <div class="sub">
    そっと心にふれる<br>
    あなたの花を見つけます
  </div>

  <div id="startArea">
    <div class="start" onclick="showEnvelope()">🍀</div>
    <div class="text">クローバーを押してください</div>
  </div>

  <div id="envelopeArea" style="display:none;">
    <div class="envelope-wrap">
      <div class="envelope">✉️</div>
      <div class="seal" onclick="openLetter()">🍀</div>
    </div>
    <div class="text">シールをめくってください</div>
  </div>

  <div id="result" class="result"></div>
  <div id="message" class="message"></div>

</div>

<script>
const flowers = [
  {
    name:"🤍 すずらん",
    message:"あなたは静かなやさしさを持つ人。そっと寄り添う力があります。"
  },
  {
    name:"🌸 さくら",
    message:"あなたは始まりの風を運ぶ人。新しい流れをやわらかく呼び込みます。"
  },
  {
    name:"🌷 チューリップ",
    message:"あなたは素直なあたたかさを持つ人。心をまっすぐに伝える美しさがあります。"
  },
  {
    name:"🌻 ひまわり",
    message:"あなたは周りを明るく照らす人。前を向く力をそっと分けてくれます。"
  },
  {
    name:"🌼 たんぽぽ",
    message:"あなたは自然体の強さを持つ人。やさしく、しなやかに咲く力があります。"
  }
];

function showEnvelope(){
  document.getElementById("startArea").style.display = "none";
  document.getElementById("envelopeArea").style.display = "block";
}

function openLetter(){
  const n = Math.floor(Math.random() * flowers.length);
  document.getElementById("envelopeArea").style.display = "none";
  document.getElementById("result").innerHTML =
    "あなたの花は<strong>" + flowers[n].name + "</strong>";
  document.getElementById("message").innerHTML =
    flowers[n].message;
}
</script>

</body>
</html>
