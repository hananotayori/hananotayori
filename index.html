<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花のたより</title>

<style>

body{
margin:0;
font-family:"Yu Gothic","Hiragino Sans",sans-serif;
background:#f3f7f1;
color:#35523a;
text-align:center;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.wrap{
max-width:420px;
padding:40px 20px;
position:relative;
}

.title{
font-size:38px;
color:#5fae66;
margin-top:120px;
margin-bottom:20px;
}

.sub{
font-size:18px;
line-height:1.8;
margin-bottom:40px;
}

.start{
font-size:80px;
cursor:pointer;
animation:float 2.5s ease-in-out infinite;
}

.text{
margin-top:10px;
font-size:16px;
color:#6c8b72;
}

.envelope{
font-size:120px;
margin-top:20px;
}

.seal{
font-size:42px;
cursor:pointer;
margin-top:-40px;
}

.result{
margin-top:40px;
font-size:26px;
line-height:1.8;
}

.message{
margin-top:10px;
font-size:18px;
color:#4d7a57;
}

.lily{
position:absolute;
top:40px;
font-size:22px;
opacity:0.6;
}

.left{
left:0;
}

.right{
right:0;
}

@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0px);}
}

</style>
</head>

<body>

<div class="wrap">

<div class="lily left">
🌿🤍<br>
🌿🤍<br>
🌿🤍
</div>

<div class="lily right">
🤍🌿<br>
🤍🌿<br>
🤍🌿
</div>

<div class="title">花のたより</div>

<div class="sub">
そっと心にふれる<br>
あなたの花を見つけます
</div>

<div id="startArea">

<div class="start" onclick="showEnvelope()">🍀</div>
<div class="text">クローバーを押してください</div>

</div>

<div id="envelopeArea" style="display:none">

<div class="envelope">✉️</div>
<div class="seal" onclick="openLetter()">🍀</div>
<div class="text">シールをめくってください</div>

</div>

<div id="result" class="result"></div>
<div id="message" class="message"></div>

</div>

<script>

const flowers = [

{
name:"🤍 すずらん",
message:"やさしく静かな心を持つあなた。そっと寄り添う力があります。"
},

{
name:"🌸 さくら",
message:"新しい流れを呼び込む人。あなたは始まりを運びます。"
},

{
name:"🌷 チューリップ",
message:"素直なあたたかさを持つ人。まっすぐな心が魅力です。"
},

{
name:"🌻 ひまわり",
message:"周りを明るく照らす人。あなたの笑顔は太陽のようです。"
},

{
name:"🌼 たんぽぽ",
message:"自然体の強さを持つ人。しなやかに咲く力があります。"
}

];

function showEnvelope(){
document.getElementById("startArea").style.display="none";
document.getElementById("envelopeArea").style.display="block";
}

function openLetter(){

const n=Math.floor(Math.random()*flowers.length);

document.getElementById("envelopeArea").style.display="none";

document.getElementById("result").innerHTML=
"あなたの花は<br><strong>"+flowers[n].name+"</strong>";

document.getElementById("message").innerHTML=
flowers[n].message;

}

</script>

</body>
</html>
